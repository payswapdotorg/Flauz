# ---------------------------------------------------------------------------------------------
# Flauz TL4 — TL4-004: whole-session acceptance battery.
#
# The session-battery job:
#   1. session-battery.mjs --require — runs the four whole-user-session
#      journeys (golden, recovery re-run, fail-closed, continuity) against
#      the REAL extension sources (node:test + type stripping, node >= 22.6)
#      and compares the distilled transcript against the pinned fixture
#      test/fixtures/session-battery/golden-transcript.json. Evidence mode:
#      SKIP is a FAIL.
#   2. A doctored-fixture probe (expected exit 1) proves the gate fires —
#      a gate that cannot fail is not a gate.
#   3. The fixture matrix — sh build/flauz/scripts/verify-fixtures.sh (every
#      harness script against every fixture, expected outcomes asserted in
#      both directions).
#
# Honesty note (spec section 4, promotion ladder): the browser leg runs the
# FakeCdpTransport and the environment leg runs the simulated remote
# executor — this is the FIXTURE rung. The real-runtime rung (CDP against a
# booted browser, LocalProcessExecutor) is the documented follow-up once the
# product runtime surfaces expose a CI-driveable seam.
#
# The compiled-unit-subset lane (flauz-hygiene.yml "Run unit tests touching
# Flauz dirs") additionally runs this suite as compiled .js — two runners,
# one battery.
#
# Constraints honored (same conventions as flauz-budgets.yml): no secrets,
# read-only perms, actions pinned to the SHAs upstream's own workflows use.
# ---------------------------------------------------------------------------------------------

name: Flauz Session

on:
  push:
    branches: [flauz/main]
    paths:
      - 'extensions/flauz-*/**'
      - 'build/flauz/**'
      - 'test/fixtures/session-battery*/**'
      - 'product.flauz.json'
      - '.github/workflows/flauz-*'
  pull_request:
    branches: [flauz/main, main]
    paths:
      - 'extensions/flauz-*/**'
      - 'build/flauz/**'
      - 'test/fixtures/session-battery*/**'
      - 'product.flauz.json'
      - '.github/workflows/flauz-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flauz-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-battery:
    name: Whole-session acceptance battery (TL4-004, fixture rung)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js (type stripping needs node >= 22.6)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # ---- the battery typecheck: spans three extensions (the pulled-in
      # flauz-environments sources run under their own laxer noUnused* flags;
      # flauz-browser sources carry their own shims) — its own tsconfig,
      # excluded from flauz-workflow's main typecheck ----
      - name: Typecheck the battery (tsconfig.session-battery.json)
        run: |
          set -e
          cd extensions/flauz-workflow
          npm install --no-audit --no-fund
          npm run typecheck-session-battery

      # ---- the battery: four journeys, real sources, pinned transcript ----
      - name: Run the whole-session battery (--require evidence mode)
        run: node build/flauz/scripts/session-battery.mjs --root . --require

      # ---- a gate that cannot fail is not a gate: the doctored fixture
      # (golden ledger row count claims 2) MUST flip the verdict to FAIL ----
      - name: Prove the gate fires (doctored fixture must exit 1)
        run: |
          set +e
          node build/flauz/scripts/session-battery.mjs --root . \
            --fixtures test/fixtures/session-battery-doctored \
            > /tmp/session-battery-doctored.log 2>&1
          code=$?
          set -e
          cat /tmp/session-battery-doctored.log
          if [ "$code" -ne 1 ]; then
            echo "::error::session battery unexpectedly exited $code on the doctored fixture (expected 1 — the gate must fire)"
            exit 1
          fi
          echo "expected: the doctored fixture fired the battery (exit 1)"

      # ---- the fixture matrix: every harness script against every fixture ----
      - name: Fixture matrix (verify-fixtures.sh)
        run: sh build/flauz/scripts/verify-fixtures.sh
