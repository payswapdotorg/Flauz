# ---------------------------------------------------------------------------------------------
# Flauz Wave 4 — Lane J. Environment registry + remote continuity canary:
# the C-ENV spec (build/flauz/canaries/C-ENV.md) as a ZERO-SECRETS job on
# ubuntu-latest (work order constraint: no secrets referenced at all — see
# the drift trip-wires in C-ENV.md for the DL-28 escalation path if the
# npm-install rate-limit flake class ever hits this job).
#
# Shape (template: flauz-canaries.yml — C-20/C-23/C-24/C-28 jobs):
#   phase 1 (fail-fast, ZERO install, zero-dep):
#     - C-ENV spec present
#     - node --test on the extension suites (registry / providers /
#       continuity / fixtures) — the unit contract
#     - the C-ENV fixture canary (env-registry-canary.mjs, assertions A1-A8)
#     - activation lint (flauz manifests; proves flauz-environments stays
#       off onStartupFinished and command-only)
#     - structural self-check of this workflow + the canary --help receipt
#   phase 2 (boot-level, gated on lane presence probe):
#     - compile + bundle + xvfb boot (C-20 recipe)
#     - B1 clean boot / no proposal drop; B2 the 7 flauz.env.* commands
#       carried by the bundled extension
#     - P1/P2 (picker + live switch) stay WAITING-ON-RUNTIME (C-ENV.md) —
#       the live resolver wiring is Wave-4-next (INTEGRATION-GAP.md section 3)
#
#   job 2 (cenv-resolver-rung2, TL3-H1): the provider resolver rung 2 —
#     the resolver unit suites + the grant/vendored-surface assertions
#     (zero-dep) + the boot-level registration drill (command-driven
#     activation through --extensionTestsPath; the A3-class DOES-NOT-EXIST
#     tripwire; skip-vs-fail documented in the job header).
#
# Gated on Flauz paths + workflow_dispatch (DL-25 gating set).
# ---------------------------------------------------------------------------------------------

name: Flauz Environments

on:
  push:
    branches: [flauz/main]
    paths:
      - 'extensions/flauz-*/**'
      - 'build/flauz/**'
      - 'product.flauz.json'
      - '.github/workflows/flauz-*'
  pull_request:
    branches: [flauz/main, main]
    paths:
      - 'extensions/flauz-*/**'
      - 'build/flauz/**'
      - 'product.flauz.json'
      - '.github/workflows/flauz-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flauz-environments-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  VSCODE_QUALITY: 'oss'

jobs:
  cenv-environment-registry:
    name: 'C-ENV canary: environment registry + continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ---- phase 1: zero-dep, fail-fast, no install ----

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: C-ENV spec + canary runner present
        run: |
          set -e
          test -f build/flauz/canaries/C-ENV.md || { echo "C-ENV spec missing (build/flauz/canaries/C-ENV.md)"; exit 1; }
          test -f build/flauz/scripts/env-registry-canary.mjs || { echo "canary runner missing"; exit 1; }
          echo "C-ENV spec + runner: OK"

      - name: Setup Node (per .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Extension unit tests (registry / providers / continuity / fixtures)
        run: |
          set -e
          cd extensions/flauz-environments
          node --test "test/*.test.ts"

      - name: C-ENV fixture canary (A1-A8)
        run: node build/flauz/scripts/env-registry-canary.mjs

      - name: Activation lint (flauz manifests; flauz-environments must be command-only)
        run: node build/flauz/scripts/activation-lint.mjs --root .

      - name: Lane presence probe (glob, never hardcode)
        id: lanes
        run: |
          if [ -f extensions/flauz-environments/package.json ] && [ -f product.flauz.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "lane J + product overlay present"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "lane J not merged yet — boot-level assertions run in PROBE-ONLY mode (documented skip)."
          fi

      # ---- phase 2: boot-level assertions (template: flauz-canaries.yml) ----

      - name: Install Linux build deps (kerberos headers, xvfb, electron libs)
        if: steps.lanes.outputs.present == 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev xvfb libgtk-3-0 libgbm1

      - name: Install dependencies + compile + bundle
        if: steps.lanes.outputs.present == 'true'
        run: |
          set -e
          node build/npm/preinstall.ts && npm install && npm run compile \
            && node build/flauz/scripts/bundle-extensions.mjs

      - name: Boot + assert the C-ENV boot-level surface (B1/B2)
        if: steps.lanes.outputs.present == 'true'
        run: |
          set -e
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb && sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults && sudo service xvfb start
          mkdir -p artifacts
          DISPLAY=:10 ./scripts/code.sh \
            --verbose --user-data-dir "$RUNNER_TEMP/cenv-userdata" \
            --extensions-dir "$RUNNER_TEMP/cenv-exts" \
            --disable-telemetry --skip-welcome --skip-release-notes \
            --disable-updates --disable-experiments --disable-workspace-trust \
            > artifacts/cenv-boot.log 2>&1 &
          sleep 25
          # B1 per C-ENV.md: clean boot; no proposal drop (DL-4 drift class)
          ! grep -qE 'Unresponsive|Fatal error' artifacts/cenv-boot.log
          ! grep -q 'DOES NOT EXIST' artifacts/cenv-boot.log \
            || { echo 'C-ENV B1 FAILED: a flauz proposed API does not exist at this HEAD'; exit 1; }
          # B2 per C-ENV.md: the 7 flauz.env.* command contributions ride the
          # bundled extension (bundle-extensions output + compile output).
          CMDS=0
          for c in flauz.env.list flauz.env.register flauz.env.unregister flauz.env.activate flauz.env.deactivate flauz.env.showPlan flauz.env.switch; do
            if grep -rq "$c" "$RUNNER_TEMP/cenv-exts" 2>/dev/null || grep -rq "$c" extensions/flauz-environments/package.json; then CMDS=$((CMDS+1)); fi
          done
          echo "C-ENV B2: $CMDS/7 flauz.env.* commands present in the bundled extension surface"
          [ "$CMDS" -eq 7 ] || { echo 'C-ENV B2 FAILED: command surface incomplete'; exit 1; }
          # registry boots clean with .flauz/ absent (no workspace): the
          # extension stays inactive without a workspace folder — no crash.
          ! grep -qE 'flauz-environments.*(failed|crash)' artifacts/cenv-boot.log
          # P1 (picker surface render) + P2 (live switch + re-hydration) are
          # WAITING-ON-RUNTIME per C-ENV.md steps 4-5 — the live resolver
          # wiring is Wave-4-next (INTEGRATION-GAP.md section 3).
          pkill -f 'scripts/code.sh' 2>/dev/null || true
          echo 'C-ENV boot-level canary: GREEN'

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0-preview
        with:
          name: flauz-canary-cenv
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  cenv-resolver-rung2:
    name: 'C-ENV resolver rung 2 (TL3-H1): trust-gated authority resolution'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ---------------------------------------------------------------------------------------------
    # TL3-H1 — provider resolver rung 2 (WORK-REGISTRY.md SS-TL3-H1):
    #   phase 1 (fail-fast, ZERO install, zero-dep, ZERO secrets):
    #     - the extension unit suites INCLUDING the resolver suites
    #       (test/resolver*.test.ts ride the existing test/*.test.ts glob:
    #       the authority grammar, the trust gate BOTH directions, the
    #       per-kind FakeCli/FakeHttp endpoint drills, the bridge handshake
    #       + the --agent-host-port mutual exclusion, the DL-31 literal-key
    #       schema rejections, re-resolution state-flip re-checks)
    #     - the SKIP-GATED live drills (test/resolverLive.test.ts) run as
    #       SKIPS here by design: they require the documented env opt-ins
    #       FLAUZ_RESOLVER_LIVE_SSH=1 / FLAUZ_RESOLVER_LIVE_DOCKER=1 AND the
    #       binary/daemon — a runner lacking sshd/docker NEVER fails this
    #       job (skip-vs-fail; they never fabricate a pass either)
    #     - the grant assertions: product.flauz.json resolvers line + the
    #       manifest enabledApiProposals + the vendored dts PROVENANCE + the
    #       host-catalog entry (the A3 tripwire source) + verify-product
    #       (the merged-product posture gate, DL-19 REPLACE semantics)
    #   phase 2 (boot-level, gated on the lane presence probe — C-ENV shape):
    #     - compile + bundle + xvfb boot with a workspace folder
    #     - the registration drill: the compiled runner drives
    #       flauz.env.resolver / flauz.env.resolve through
    #       --extensionTestsPath (command-driven ACTIVATION; the resolver
    #       registration path executes; the trust gate at the command level)
    #     - the A3-class tripwire: the boot log must NOT contain the
    #       DOES-NOT-EXIST proposal warning (the grant live AND matching)
    # ---------------------------------------------------------------------------------------------
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node (per .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Extension unit tests (registry / providers / continuity / lifecycle / resolver)
        run: |
          set -e
          cd extensions/flauz-environments
          node --test "test/*.test.ts"

      - name: Resolver grant + vendored surface assertions (zero-dep, fail-fast)
        run: |
          set -e
          # the grant lands in the SAME commit as the live resolver code (DL-19/DL-33, no dead config)
          grep -q '"flauz.flauz-environments"' product.flauz.json \
            || { echo 'TL3-H1: the resolvers grant is missing from product.flauz.json extensionEnabledApiProposals'; exit 1; }
          grep -A2 '"flauz.flauz-environments"' product.flauz.json | grep -q '"resolvers"' \
            || { echo 'TL3-H1: the resolvers grant line is malformed'; exit 1; }
          grep -A2 '"enabledApiProposals"' extensions/flauz-environments/package.json | grep -q '"resolvers"' \
            || { echo 'TL3-H1: the manifest enabledApiProposals must carry resolvers'; exit 1; }
          # the vendored proposal surface with PROVENANCE (the flauz-browser vscode-dts precedent)
          test -f extensions/flauz-environments/vscode-dts/vscode.proposed.resolvers.d.ts \
            || { echo 'TL3-H1: the vendored resolvers dts is missing'; exit 1; }
          grep -q 'PROVENANCE' extensions/flauz-environments/vscode-dts/vscode.proposed.resolvers.d.ts \
            || { echo 'TL3-H1: the vendored resolvers dts lacks its PROVENANCE line'; exit 1; }
          # the A3-class tripwire source of truth: the proposal EXISTS in the host catalog
          grep -q 'resolvers:' src/vs/platform/extensions/common/extensionsApiProposals.ts \
            || { echo 'TL3-H1: the resolvers proposal is missing from the host catalog (DL-4 drift class)'; exit 1; }
          # the merged-product posture gate (the grant valid against the MERGED product)
          node build/flauz/scripts/verify-product.mjs --root . --require
          echo 'TL3-H1 resolver grant surface: OK'

      - name: Lane presence probe (glob, never hardcode)
        id: lanes
        run: |
          if [ -f extensions/flauz-environments/package.json ] && [ -f product.flauz.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "lane J + product overlay present"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "lane J not merged yet — boot-level drill runs in PROBE-ONLY mode (documented skip)."
          fi

      - name: Install Linux build deps (kerberos headers, xvfb, electron libs)
        if: steps.lanes.outputs.present == 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev xvfb libgtk-3-0 libgbm1

      - name: Install dependencies + compile + bundle
        if: steps.lanes.outputs.present == 'true'
        run: |
          set -e
          node build/npm/preinstall.ts && npm install && npm run compile \
            && node build/flauz/scripts/bundle-extensions.mjs

      - name: Assert the bundle carries the registration surface + compile the drill
        if: steps.lanes.outputs.present == 'true'
        run: |
          set -e
          grep -q 'registerRemoteAuthorityResolver' extensions/flauz-environments/dist/extension.js \
            || { echo 'TL3-H1: the registration call is missing from the bundled extension'; exit 1; }
          grep -q 'flauz-env' extensions/flauz-environments/dist/extension.js \
            || { echo 'TL3-H1: the flauz-env authority prefix is missing from the bundled extension'; exit 1; }
          mkdir -p "$RUNNER_TEMP/resolver-drill"
          build/node_modules/esbuild/bin/esbuild extensions/flauz-environments/test/boot/registrationDrill.ts \
            --bundle --format=cjs --platform=node --target=es2022 --external:vscode \
            --outfile="$RUNNER_TEMP/resolver-drill/registrationDrill.js"
          echo 'TL3-H1 registration surface rides the bundle: OK'

      - name: Boot + drive the registration drill (command-driven activation; A3 tripwire)
        if: steps.lanes.outputs.present == 'true'
        run: |
          set -e
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb && sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults && sudo service xvfb start
          mkdir -p artifacts "$RUNNER_TEMP/resolver-ws"
          # --extensionTestsPath drives the compiled drill inside the booted
          # workbench (a workspace folder is open so the registry boots);
          # the app exits with the drill's exit code.
          set +e
          DISPLAY=:10 ./scripts/code.sh \
            --verbose --user-data-dir "$RUNNER_TEMP/cenv-resolver-userdata" \
            --extensions-dir "$RUNNER_TEMP/cenv-resolver-exts" \
            --disable-telemetry --skip-welcome --skip-release-notes \
            --disable-updates --disable-experiments --disable-workspace-trust \
            "$RUNNER_TEMP/resolver-ws" \
            --extensionTestsPath="$RUNNER_TEMP/resolver-drill/registrationDrill.js" \
            > artifacts/cenv-resolver-boot.log 2>&1
          DRILL_EXIT=$?
          set -e
          echo "registration drill exit: $DRILL_EXIT"
          # A3-class tripwire: the grant must be live AND matching (no proposal
          # warning class in the boot log — extensionsProposedApi.ts:47-50).
          if grep -q 'DOES NOT EXIST' artifacts/cenv-resolver-boot.log; then
            echo 'TL3-H1 FAILED: a proposed API does not exist at this HEAD (DL-4 drift class)'
            exit 1
          fi
          if grep -qE 'Unresponsive|Fatal error' artifacts/cenv-resolver-boot.log; then
            echo 'TL3-H1 FAILED: the boot crashed or hung'
            exit 1
          fi
          if [ "$DRILL_EXIT" -ne 0 ]; then
            echo 'TL3-H1 FAILED: the registration drill failed (see artifacts/cenv-resolver-boot.log)'
            exit 1
          fi
          echo 'C-ENV resolver rung 2 boot drill: GREEN'

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0-preview
        with:
          name: flauz-canary-cenv-resolver
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
