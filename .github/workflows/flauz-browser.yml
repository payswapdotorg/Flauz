# ---------------------------------------------------------------------------------------------
# Flauz Wave 4 — Lane I (browser policy engine + partition model + the
# blocked-at-all-layers verification story).
#
# Three jobs:
#   1. b-policy-unit   — the zero-dep verification standard: the flauz-browser
#                        node --test suites (156 cases as of TL3-001: the 96
#                        legacy policy cases + the browser-runtime suites —
#                        cdp transport/fake, session manager, navigation
#                        pipeline, capture, recovery, workbench host) + the
#                        A-class DRIVER DRILL (policy-gated navigation with
#                        the FakeCdpTransport: deny sends ZERO CDP commands)
#                        + a tsc --noEmit gate. The glob `test/*.test.ts`
#                        picks up every suite automatically (no file list).
#                        Runs on a bare checkout (no repo install; the only
#                        install is a global typescript for the typecheck).
#   2. b-policy-canary — the B-POLICY canary (spec:
#                        build/flauz/canaries/B-POLICY.md): xvfb boot of the
#                        flauz build with a policy-carrying workspace, the
#                        boot-level assertion set (A1-A3: engine verdict on
#                        the fixture policy, clean boot + bundle --verify,
#                        networkFilter + browserView compile greps). The
#                        driver-dependent layered-gate assertions (A4-A10)
#                        are SATISFIED AT THE UNIT LEVEL by the TL3-001
#                        runtime (fake-driver drills in job 1) — the
#                        boot-level greps that still need a real workbench
#                        are marked as such in the spec. The jobs detect
#                        lane presence by glob (never hardcode) and report
#                        skips with reasons instead of failing.
#   3. b-policy-boot-drill (TL3-H2) — the WORKBENCH BOOT DRILL: compiles the
#                        workbench, installs the test-driver extension
#                        fixture (test/fixtures/browser-policy-driver) into
#                        the canary profile's --extensions-dir, boots under
#                        xvfb with the fixture policy workspace, and lets the
#                        driver invoke the flauz.browser.* command surface
#                        through the REAL activation machinery in the BOOTED
#                        workbench (the P0 posture: window.openBrowserTab +
#                        BrowserTab.startCDPSession under the live `browser`
#                        product grant + the TL3-002 hardening over the real
#                        session). The zero-dep evaluator
#                        build/flauz/scripts/b-policy-boot-drill.mjs asserts
#                        the driver report, the activation record, the
#                        proposal trip-wires, the runtime log lines (the
#                        log-backed channel in the logs tree) and the session
#                        journal — closing the B-POLICY A4/A6/A10 "stays
#                        boot-level" notes as far as the architecture allows
#                        (ERR_BLOCKED_BY_CLIENT stays an honest SKIP row).
#                        Trigger policy (the compat-l3 precedent, documented
#                        in the job): the job COMPILES the workbench — too
#                        expensive for every push. workflow_dispatch + ONE
#                        weekly schedule canary; push/PR triggers keep
#                        running jobs 1-2 only.
#
# Constraints honored (work order section 3):
#   - zero-secrets posture: b-policy-unit uses NO tokens at all. b-policy-canary
#     and b-policy-boot-drill mirror flauz-canaries.yml and carry ONLY the
#     auto-provided workflow token on the install step — the DL-20/DL-28
#     adjudicated narrow exception (auto-token only; nothing configured in
#     the repo; lifts the api.github.com rate limits that break the
#     ripgrep-prebuilt fetch, the round-7 flake).
#   - ubuntu-latest, gated on the Flauz paths (DL-25) + workflow_dispatch
#     (the sync runbook triggers this workflow at EVERY sync — DL-11) + the
#     weekly schedule for job 3.
# ---------------------------------------------------------------------------------------------

name: Flauz Browser Policy

on:
  push:
    branches: [flauz/main]
    paths:
      - 'extensions/flauz-*/**'
      - 'build/flauz/**'
      - 'product.flauz.json'
      - '.github/workflows/flauz-*'
      - 'test/fixtures/browser-policy-driver/**'
  pull_request:
    branches: [flauz/main, main]
    paths:
      - 'extensions/flauz-*/**'
      - 'build/flauz/**'
      - 'product.flauz.json'
      - '.github/workflows/flauz-*'
      - 'test/fixtures/browser-policy-driver/**'
  workflow_dispatch:
  schedule:
    # TL3-H2 trigger policy (the compat-l3 precedent): ONE weekly canary run
    # of the boot drill (it compiles the workbench; jobs 1-2 stay on push/PR).
    # Tuesdays 04:41 UTC - off the hour to avoid scheduler contention.
    - cron: '41 4 * * 2'

permissions:
  contents: read

concurrency:
  group: flauz-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  VSCODE_QUALITY: 'oss'

jobs:
  b-policy-unit:
    name: 'B-POLICY unit: layered policy engine test suites'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Spec present?
        run: |
          test -f build/flauz/canaries/B-POLICY.md || { echo "B-POLICY spec missing (build/flauz/canaries/B-POLICY.md)"; exit 1; }
          echo "B-POLICY spec: OK"

      - name: Lane presence probe (glob, never hardcode)
        id: lanes
        run: |
          if ls extensions/flauz-browser/package.json >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "flauz-browser lane present"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "flauz-browser not merged yet — unit job runs in PROBE-ONLY mode (documented skip)."
          fi

      - name: Setup Node (per .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Run the flauz-browser node --test suites (zero-dep)
        if: steps.lanes.outputs.present == 'true'
        run: |
          set -e
          cd extensions/flauz-browser
          node --test "test/*.test.ts" 2>&1 | tee "$RUNNER_TEMP/bpolicy-unit.log"
          # node --test exits non-zero on any failure; assert the counts made it to the log:
          grep -q '^. tests ' "$RUNNER_TEMP/bpolicy-unit.log" || { echo 'unit runner produced no summary'; exit 1; }

      - name: B-POLICY driver drill — policy-gated navigation with the FakeCdpTransport (A-class)
        if: steps.lanes.outputs.present == 'true'
        run: |
          set -e
          cd extensions/flauz-browser
          # A5/A7/A9/A10 unit-level driver assertions (spec: build/flauz/canaries/B-POLICY.md):
          # the REAL runtime over the scriptable simulator — zero secrets, zero network.
          # Probe by glob (never hardcode a lane file list):
          test -f test/canaries/policy-gated-navigation.drill.ts \
            || { echo 'B-POLICY driver drill script missing (test/canaries/policy-gated-navigation.drill.ts)'; exit 1; }
          node test/canaries/policy-gated-navigation.drill.ts 2>&1 | tee "$RUNNER_TEMP/bpolicy-drill.log"
          grep -q 'driver drill: GREEN' "$RUNNER_TEMP/bpolicy-drill.log" \
            || { echo 'B-POLICY driver drill did not report GREEN'; exit 1; }
          echo 'B-POLICY driver drill: GREEN (deny sends ZERO CDP commands — pinned)'

      - name: Typecheck (tsc --noEmit, isolated global install — never a repo install)
        if: steps.lanes.outputs.present == 'true'
        run: |
          set -e
          npm install -g typescript@5.9.3
          cd extensions/flauz-browser
          tsc --noEmit
          echo 'B-POLICY typecheck: GREEN'

      - name: Probe-only notice
        if: steps.lanes.outputs.present != 'true'
        run: echo 'flauz-browser lane absent — B-POLICY unit suite skipped (documented; activation/rota lanes unaffected).'

  b-policy-canary:
    name: 'B-POLICY canary: policy-gated browser pane (boot-level)'
    # TL3-H2 trigger discipline: keeps its EXISTING triggers (push/PR paths +
    # workflow_dispatch); the weekly schedule is the boot drill's + the cheap
    # unit job's lane (the compat-l3 weekly-canary convention).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Spec present?
        run: |
          test -f build/flauz/canaries/B-POLICY.md
          echo "B-POLICY spec: OK"

      - name: Lane presence probe (glob, never hardcode)
        id: lanes
        run: |
          if ls extensions/flauz-*/package.json >/dev/null 2>&1 && [ -f product.flauz.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "flauz lanes + product overlay present"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "flauz lanes / product.flauz.json not merged yet — B-POLICY canary runs in PROBE-ONLY mode (documented skip of boot assertions)."
          fi

      - name: Setup Node (per .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Linux build deps (kerberos headers, xvfb, electron libs)
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev xvfb libgtk-3-0 libgbm1

      - name: Install dependencies (setup-electron needs vinyl-fs from node_modules)
        run: node build/npm/preinstall.ts && npm install
        env:
          # auto-provided workflow token ONLY (DL-20/DL-28 narrow exception):
          # lifts api.github.com rate limits that break the ripgrep-prebuilt
          # release fetch (403 class, round-7 canary flake). Nothing is
          # configured in the repo; the no-secrets policy holds.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Electron
        uses: ./.github/actions/setup-electron
        with:
          arch: x64

      - name: Boot the policy-gated workspace and assert the B-POLICY boot-level surface
        if: steps.lanes.outputs.present == 'true'
        run: |
          set -e
          # deps pre-installed; compile + bundle the flauz extensions so boots ACTIVATE them
          npm run compile
          node build/flauz/scripts/bundle-extensions.mjs
          node build/flauz/scripts/bundle-extensions.mjs --verify \
            || { echo 'B-POLICY A2 FAILED: a flauz-* extension main is missing from dist/ (round-16 class)'; exit 1; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb && sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults && sudo service xvfb start
          mkdir -p artifacts
          # Fixture workspace: the cdp-bypass-cases.json 'base' policy (restrictive allowlist)
          WS="$RUNNER_TEMP/bpolicy-ws"
          mkdir -p "$WS/.flauz"
          cat > "$WS/.flauz/browser-policy.json" <<'POLICY'
          {
            "schemaVersion": 0,
            "driver": { "allow": ["*.example.com"] },
            "webRequest": { "allow": ["*.example.com"] },
            "willNavigate": { "allow": ["*.example.com"] }
          }
          POLICY
          # Canary-profile settings: networkFilter default-on for the agent scope
          # (product default flip is flauz-defaults config — INTEGRATION-GAP.md G3/P1)
          UD="$RUNNER_TEMP/bpolicy-userdata"
          mkdir -p "$UD/User"
          cat > "$UD/User/settings.json" <<'SETTINGS'
          { "chat.agent.networkFilter": true }
          SETTINGS
          # B-POLICY A1 (pre-boot, zero-dep): the REAL engine denies a CDP nav to
          # a non-allowlisted host at the driver layer under the fixture policy.
          node --input-type=module -e "
            import { BrowserPolicyEngine } from './extensions/flauz-browser/src/policy.ts';
            import { readFile } from 'node:fs/promises';
            const text = await readFile('$WS/.flauz/browser-policy.json', 'utf-8');
            const engine = BrowserPolicyEngine.fromPolicyText(text);
            const verdict = engine.evaluate({ url: 'https://evil.org/pay', initiator: 'agent-tool' }).final;
            console.log('B-POLICY A1 verdict:', verdict.decision, verdict.layer, verdict.initiator);
            if (verdict.decision !== 'deny' || verdict.layer !== 'driver' || verdict.initiator !== 'agent-tool') {
              console.error('B-POLICY A1 FAILED: expected deny/driver/agent-tool'); process.exit(1);
            }
          "
          echo 'B-POLICY A1: fixture policy denies a CDP nav to a non-allowlisted host at the driver layer'
          # Boot with the policy-carrying workspace open (flauz-browser is bundled;
          # it activates lazily on the first flauz.browser.* command — the A4-A10
          # log-line/driver assertions are WAITING-ON-LANE F/driver per the spec).
          DISPLAY=:10 ./scripts/code.sh \
            --verbose --user-data-dir "$UD" \
            --extensions-dir "$RUNNER_TEMP/bpolicy-exts" \
            --disable-telemetry --skip-welcome --skip-release-notes \
            --disable-updates --disable-experiments --disable-workspace-trust \
            "$WS" \
            > artifacts/bpolicy-boot.log 2>&1 &
          BOOT_PID=$!
          sleep 25
          # A2: clean boot with the extension installed + the workspace open
          ! grep -qE 'Unresponsive|Fatal error' artifacts/bpolicy-boot.log \
            || { echo 'B-POLICY A2 FAILED: boot not clean'; exit 1; }
          # A3: the in-tree gate surfaces compiled in (sync-drift canaries)
          test -f out/vs/platform/networkFilter/common/networkFilterService.js \
            || { echo 'B-POLICY A3 FAILED: networkFilter service missing from compile output (upstream drift)'; exit 1; }
          grep -rq 'browserView' out/vs/workbench/contrib/browserView/browser/browserView.contribution.js 2>/dev/null \
            || { echo 'B-POLICY A3 FAILED: browserView contribution missing from compile output (upstream drift)'; exit 1; }
          kill $BOOT_PID 2>/dev/null || true
          echo 'B-POLICY boot-level canary: GREEN (A4-A10 satisfied at the unit level by the TL3-001 driver drill in b-policy-unit; boot-level residuals marked in build/flauz/canaries/B-POLICY.md)'

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0-preview
        with:
          name: flauz-canary-bpolicy
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  b-policy-boot-drill:
    name: 'B-POLICY workbench boot drill: openBrowserTab E2E under the grant (TL3-H2)'
    # Trigger policy (the compat-l3 precedent, flauz-compat.yml compat-l3):
    # this job COMPILES the workbench (npm install + compile + bundle + the
    # electron setup) - far too expensive for every push. It runs ONLY on
    # workflow_dispatch (opt-in) plus ONE weekly schedule canary so the
    # workbench-boot P0 claim stays continuously proven. Push/PR triggers
    # keep running jobs 1-2 (their steps are untouched).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90  # install + compile + bundle + electron + xvfb + boot + drill (the compat-l3 budget)
    env:
      # Mirrors the sibling jobs: binaries are fetched explicitly later
      # (setup-electron composite action), never during npm install.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      VSCODE_QUALITY: 'oss'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the drill observes RUNTIME state, not git history - the same
          # shallow shape the boot lanes use (b-policy-canary / compat-l3)
          fetch-depth: 1

      - name: Spec + driver fixture present?
        run: |
          set -e
          test -f build/flauz/canaries/B-POLICY.md \
            || { echo 'B-POLICY spec missing (build/flauz/canaries/B-POLICY.md)'; exit 1; }
          test -f build/flauz/scripts/b-policy-boot-drill.mjs \
            || { echo 'boot drill evaluator missing (build/flauz/scripts/b-policy-boot-drill.mjs)'; exit 1; }
          test -f test/fixtures/browser-policy-driver/package.json \
            || { echo 'test-driver extension fixture missing (test/fixtures/browser-policy-driver/)'; exit 1; }
          echo 'B-POLICY boot drill: spec + evaluator + driver fixture OK'

      - name: Setup Node (per .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Linux build deps (kerberos headers, xvfb, electron libs)
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev xvfb libgtk-3-0 libgbm1

      - name: Install dependencies (setup-electron needs vinyl-fs from node_modules)
        run: node build/npm/preinstall.ts && npm install
        env:
          # auto-provided workflow token ONLY (DL-20/DL-28 narrow exception,
          # same as b-policy-canary / flauz-hygiene): lifts api.github.com rate
          # limits on the ripgrep-prebuilt release fetch. Nothing is configured
          # in the repo; the no-secrets policy holds.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile the bootable dev tree (out/, the b-policy-canary compile)
        run: npm run compile

      - name: Bundle the flauz built-ins so boots ACTIVATE them
        run: |
          set -e
          node build/flauz/scripts/bundle-extensions.mjs
          node build/flauz/scripts/bundle-extensions.mjs --verify \
            || { echo 'B-POLICY boot drill: a flauz-* extension main is missing from dist/ - the boot below would not activate the flauz built-ins'; exit 1; }

      - name: Setup Electron
        uses: ./.github/actions/setup-electron
        with:
          arch: x64

      - name: Boot with the test-driver extension and run the workbench boot drill
        run: |
          set -e
          # X server the way this repo's own boot lanes do (b-policy-canary +
          # compat-l3): xvfb as a service, DISPLAY=:10
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb && sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults && sudo service xvfb start
          mkdir -p artifacts
          # Fixture workspace: the B-POLICY 'base' policy (the canary matrix)
          # with perAgent partitions so the agent session mints the
          # persist:flauz-<hash>-boot-drill name the drill pins.
          WS="$RUNNER_TEMP/bpolicy-drill-ws"
          mkdir -p "$WS/.flauz"
          cat > "$WS/.flauz/browser-policy.json" <<'POLICY'
          {
            "schemaVersion": 0,
            "driver": { "allow": ["*.example.com"] },
            "webRequest": { "allow": ["*.example.com"] },
            "willNavigate": { "allow": ["*.example.com"] },
            "partitions": { "scope": "persist", "perAgent": true }
          }
          POLICY
          # Canary-profile settings: networkFilter default-on for the agent
          # scope (canary scope only; the product default flip is the
          # product-side decision recorded in INTEGRATION-GAP.md G3 - the
          # TL3-H2 permanent limitation record).
          UD="$RUNNER_TEMP/bpolicy-drill-userdata"
          mkdir -p "$UD/User"
          cat > "$UD/User/settings.json" <<'SETTINGS'
          { "chat.agent.networkFilter": true }
          SETTINGS
          # The TEST-DRIVER EXTENSION (CI test infrastructure, NOT a product
          # extension): installed into the canary profile's --extensions-dir.
          # It carries no flauz- prefix, lives under test/fixtures/ (the
          # fixture-workspace hygiene class), and activates onStartupFinished
          # (allowed: the activation-lint caps apply to extensions/flauz-*
          # built-ins only). It invokes the flauz.browser.* command surface
          # through the REAL lazy onCommand activation machinery and writes
          # .flauz/boot-drill/driver-report.json in the workspace.
          EXTS="$RUNNER_TEMP/bpolicy-drill-exts"
          mkdir -p "$EXTS"
          cp -r test/fixtures/browser-policy-driver "$EXTS/flauztest.bpolicy-boot-driver"
          # Boot: the compiled + bundled workbench (flauz built-ins activate
          # from the in-repo extensions scan), the driver in the profile
          # extensions dir, CDP endpoint on 9333 for the boot readiness row.
          DISPLAY=:10 ./scripts/code.sh \
            --verbose --user-data-dir "$UD" \
            --extensions-dir "$EXTS" \
            --disable-gpu --disable-telemetry --skip-welcome --skip-release-notes \
            --disable-updates --disable-experiments --disable-workspace-trust \
            --remote-debugging-port=9333 \
            "$WS" > artifacts/bpolicy-drill-boot.log 2>&1 &
          BOOT_PID=$!
          echo "$BOOT_PID" > artifacts/bpolicy-drill-boot.pid
          # The zero-dep evaluator: polls the driver report, asserts the
          # activation record + the proposal trip-wires + the runtime log
          # lines (the log-backed channel file under the logs tree) + the
          # session journal. SKIP rows carry exact reasons (honesty law);
          # FAIL rows exit non-zero. The process tree is killed ALWAYS.
          status=0
          node build/flauz/scripts/b-policy-boot-drill.mjs \
            --report "$WS/.flauz/boot-drill/driver-report.json" \
            --report-timeout 180000 \
            --cdp-port 9333 --boot-timeout 120000 \
            --log artifacts/bpolicy-drill-boot.log \
            --log-dir "$UD/logs" \
            --workspace "$WS" \
            --json --out artifacts/bpolicy-drill-report.json || status=$?
          kill "$BOOT_PID" 2>/dev/null || true
          sleep 2
          pkill -f "bpolicy-drill-userdata" 2>/dev/null || true
          exit $status

      - name: Upload boot drill artifacts (boot log + driver report + evaluator report, always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0-preview
        with:
          name: flauz-bpolicy-boot-drill
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
